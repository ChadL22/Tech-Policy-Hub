  title: Why is Tech Regulation so Hard?
  summary: Dr. Ido Sivan-Sevilla, in his essay for The Regulatory Review,  surveys the difficulties of regulating technology across issues and policy requirements.  He details six factors that contribute to the problem, arguing that the people who work for tech companies are not malicious, but they work in a structure that rewards societal harm. The pressing question is whether regulators can change that structure and create a convergence in corporate and social interests for tech usage and development.
