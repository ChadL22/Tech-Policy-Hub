  title: Announcing ZeitGEIS 2026
  location: Virtual
  meta: Join members of the GEIS research group for our second annual public meeting, where we look back on a year of work on elections and information security and ahead to 2027. Across three panels, GEIS members and invited speakers will share new research on AI and elections, political influence in digital spaces, and socio-technical approaches to improving information diets. We invite students, faculty, and public officials to engage with our team, share perspectives, and explore new opportunities to strengthen the resilience of our political and information ecosystems.
  link: https://geis.info.umd.edu/zeitgeis-2026/
