# Sveltia CMS config for the Tech Policy Hub site -- see README "Content
# management" for the full picture (this file is only piece 1 of 3: the
# GitHub OAuth backend and the auto-rebuild workflow are the other two,
# and the OAuth piece needs a one-time setup step by a repo/org admin
# before this admin UI can actually log anyone in).
#
# Scope: only the simple, flat, frequently-edited content lists are
# exposed here -- people, events, past events, homepage news/spotlight/
# reading items, and guiding questions. Deliberately NOT included:
# - build/data/topic_detail.yml -- nested per-research-area
#   projects/publications/people, not a flat list; needs a more involved
#   config (or a data-shape change) to edit safely through this UI.
# - build/data/area_meta.yml, event_categories.yml, role_types.yml,
#   reading_types.yml, reading_type_labels.yml -- small, rarely-changed
#   taxonomies tied to hardcoded CSS colors/classes elsewhere in the
#   site (AREA_META's colors, EVENT_CATEGORIES' colors, etc.); adding a
#   new key here without a matching CSS/markup change elsewhere would
#   silently render wrong, so these stay a deliberate hand-edit (by
#   someone touching code) rather than a CMS field. Their *values* are
#   still used as this file's own select-field options below, so they
#   stay in sync with what the site actually renders.
#
# Every collection below is a Decap/Sveltia "file collection" pointing
# straight at one build/data/*.yml file, using Sveltia's `root: true`
# list option so the file's own top-level array is edited directly --
# no wrapper key, so these are the exact same files build/generate.py's
# load_data() already reads. Editing here and publishing commits
# straight to build/data/*.yml on `main`; the site then rebuilds
# automatically via .github/workflows/rebuild-on-content-change.yml.

backend:
  name: github
  repo: ChadL22/Tech-Policy-Hub
  branch: main

# Required by Sveltia/Decap even though this site has no real "upload an
# image and reference it" workflow yet (PEOPLE_ITEMS photos are still
# initials placeholders -- see README "Known placeholders"). Pointed at
# a real, already-existing folder so an editor who does add an image
# somewhere doesn't get a broken path.
media_folder: docs/assets/img
public_folder: /assets/img

collections:
  - name: people
    label: People
    files:
      - name: people
        label: People
        file: build/data/people.yml
        fields:
          - name: people
            label: People
            widget: list
            root: true
            summary: '{{name}} — {{role}}'
            fields:
              - { name: initials, label: "Initials (avatar)", widget: string, pattern: ['^.{1,3}$', 'Use 1–3 characters'] }
              - { name: name, label: Name, widget: string }
              - { name: role, label: "Title / Role", widget: string, hint: "Shown as this person's section header on the People page." }
              - { name: focus, label: "Focus (short, one line)", widget: string }
              - name: role_types
                label: "Role Type(s)"
                widget: select
                multiple: true
                hint: "Drives the People page's Role filter. See build/data/role_types.yml for the current labels."
                options:
                  - { label: Leadership, value: leadership }
                  - { label: "Area Lead", value: lead }
                  - { label: Affiliate, value: affiliate }
                  - { label: Fellow, value: fellow }
                  - { label: "Graduate Fellow", value: grad-fellow }
              - { name: bio, label: Bio, widget: text }
              - { name: website, label: Website, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }

  - name: events
    label: Events
    files:
      - name: upcoming
        label: "Upcoming Events"
        file: build/data/events.yml
        fields:
          - name: events
            label: Events
            widget: list
            root: true
            summary: '{{title}} ({{y}}-{{m}}-{{d}})'
            fields:
              - { name: y, label: Year, widget: number, value_type: int }
              - name: m
                label: Month
                widget: select
                options: [JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC]
              - { name: d, label: "Day of month", widget: string, hint: "Two digits, e.g. 09 — kept as text so a leading zero displays correctly." }
              - name: cat
                label: Category
                widget: select
                hint: "Colors/legend come from build/data/event_categories.yml."
                options: ["Speaker Series", Workshop, Roundtable, "Annual Event", Conference]
              - { name: title, label: Title, widget: string }
              - { name: meta, label: "Meta line (time · location)", widget: string }
              - { name: link, label: Link, widget: string }
      - name: past
        label: "Past Events"
        file: build/data/past_events.yml
        fields:
          - name: past_events
            label: "Past Events"
            widget: list
            root: true
            summary: '{{title}} ({{y}})'
            fields:
              - { name: y, label: Year, widget: number, value_type: int }
              - name: m
                label: Month
                widget: select
                options: [JAN, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC]
              - name: cat
                label: Category
                widget: select
                options: ["Speaker Series", Workshop, Roundtable, "Annual Event", Conference]
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: link, label: Link, widget: string }

  - name: homepage
    label: "Homepage Content"
    files:
      - name: news
        label: "Hub News"
        file: build/data/news_items.yml
        fields:
          - name: news
            label: "News Items"
            widget: list
            root: true
            summary: '{{title}}'
            fields:
              - { name: tag, label: Tag, widget: string }
              - { name: date, label: Date, widget: string, hint: 'e.g. "Jul 2025" — freeform text, not a date picker, to match the rest of the site.' }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: link, label: Link, widget: string }
      - name: spotlight
        label: "Research Spotlight"
        file: build/data/spotlight_items.yml
        fields:
          - name: spotlight
            label: "Spotlight Items"
            widget: list
            root: true
            summary: '{{title}}'
            fields:
              - { name: tag, label: Tag, widget: string }
              - name: topic
                label: "Research Area"
                widget: select
                options: [Cybersecurity, "Consumer Privacy", "Information Integrity", "Trustworthy ML"]
              - { name: topic_file, label: "Research Area link", widget: string }
              - { name: date, label: Date, widget: string }
              - { name: source, label: Source, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: primary_label, label: "Button label", widget: string, hint: 'e.g. "Read the Paper", "Read the Coverage", "Event Details"' }
              - { name: link, label: Link, widget: string }
      - name: reading
        label: "What We're Reading"
        file: build/data/reading_items.yml
        fields:
          - name: reading
            label: "Reading Items"
            widget: list
            root: true
            summary: '{{title}}'
            fields:
              - { name: source, label: Source, widget: string }
              - name: type
                label: "Content Type"
                widget: select
                hint: "See build/data/reading_type_labels.yml for how each shows on the card."
                options: ["Research Papers", "Policy Artifacts", "Legal Analyses", Essays, Articles, Reports]
              - { name: title, label: Title, widget: string }
              - { name: summary, label: Summary, widget: text }
              - { name: meta, label: "Meta line", widget: string, hint: 'e.g. "6 min read"' }
              - { name: link, label: Link, widget: string }
      - name: questions
        label: "Guiding Questions"
        file: build/data/questions.yml
        fields:
          - name: questions
            label: "Guiding Questions"
            widget: list
            root: true
            summary: '{{text}}'
            fields:
              - { name: text, label: Question, widget: text }
              - name: tag
                label: "Research Area"
                widget: select
                options: [Cybersecurity, "Consumer Privacy", "Information Integrity", "Trustworthy ML", "Policy Design", Practice, Teaching]
              - { name: link, label: Link, widget: string }
